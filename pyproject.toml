[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-mio"
version = "0.1.0.dev20261108+gitguidance1"
description = "Bounded, advisory-only common M.I.O. reasoning core"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = []

[project.scripts]
mio-ir = "azazel_mio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
